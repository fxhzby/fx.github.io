<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#E85D3A">
  <title>菜谱详情 - 美味厨房</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        美味厨房
      </a>
      <div class="nav-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="navSearchInput" placeholder="搜索菜谱、食材...">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">首页</a>
        <a href="search.html">搜索</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- 详情页主体 -->
  <img class="detail-hero" id="detailHero" src="" alt="">
  <div class="detail-container">
    <div class="detail-card">
      <div class="detail-main">
        <div class="detail-header">
          <div>
            <h1 class="detail-title" id="detailTitle"></h1>
            <p class="detail-author" id="detailAuthor"></p>
          </div>
          <div class="detail-rating" id="detailRating"></div>
        </div>

        <div class="detail-info-bar" id="detailInfoBar"></div>

        <div class="ingredients-section">
          <h3>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
            食材清单
          </h3>
          <div class="ingredient-list" id="ingredientList"></div>
        </div>

        <div class="steps-section" style="margin-top:32px">
          <h3>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
            烹饪步骤
          </h3>
          <div class="steps-list" id="stepsList"></div>
        </div>
      </div>

      <aside class="sidebar">
        <div>
          <button class="detail-fav-btn" id="detailFavBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            收藏菜谱
          </button>
        </div>

        <div class="sidebar-card">
          <h4>标签</h4>
          <div class="tag-cloud" id="tagCloud"></div>
        </div>

        <div class="sidebar-card">
          <h4>相关推荐</h4>
          <div class="related-list" id="relatedList"></div>
        </div>
      </aside>
    </div>
  </div>

  <footer class="footer">
    <p>美味厨房 &copy; 2026 &mdash; 发现美食，享受生活</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/detail.js"></script>
</body>
</html>

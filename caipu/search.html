<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#E85D3A">
  <title>搜索菜谱 - 美味厨房</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 导航栏 -->
  <nav class="navbar">
    <div class="navbar-inner">
      <a href="index.html" class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
        美味厨房
      </a>
      <div class="nav-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="navSearchInput" placeholder="搜索菜谱、食材...">
      </div>
      <div class="nav-links" id="navLinks">
        <a href="index.html">首页</a>
        <a href="search.html" class="active">搜索</a>
      </div>
      <button class="hamburger" id="hamburger" aria-label="菜单">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <!-- 搜索页主体 -->
  <main class="container search-page">
    <h1 class="section-title">搜索菜谱</h1>

    <div class="search-header">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="搜索菜谱名称或标签...">
      </div>
    </div>

    <div class="filter-bar">
      <div class="filter-group">
        <span class="filter-label">分类：</span>
        <select class="filter-select" id="filterCategory">
          <option value="">全部</option>
          <option value="早餐">早餐</option>
          <option value="午餐">午餐</option>
          <option value="晚餐">晚餐</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">难度：</span>
        <select class="filter-select" id="filterDifficulty">
          <option value="">全部</option>
          <option value="简单">简单</option>
          <option value="中等">中等</option>
          <option value="困难">困难</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">时间：</span>
        <select class="filter-select" id="filterTime">
          <option value="">不限</option>
          <option value="15">15分钟内</option>
          <option value="30">30分钟内</option>
          <option value="60">1小时内</option>
        </select>
      </div>
      <div class="filter-group">
        <span class="filter-label">口味：</span>
        <select class="filter-select" id="filterTaste">
          <option value="">全部</option>
          <option value="甜">甜</option>
          <option value="咸">咸</option>
          <option value="辣">辣</option>
        </select>
      </div>
    </div>

    <div class="ingredient-search">
      <input type="text" class="ingredient-input" id="ingredientInput" placeholder="输入食材名称，按回车添加（如：鸡蛋、西红柿）">
      <button class="btn-upload" id="btnSearchIngredient">按食材搜索</button>
      <div class="ingredient-tags" id="ingredientTags"></div>
    </div>

    <p class="result-count" id="resultCount"></p>
    <div class="recipe-grid" id="searchGrid"></div>
  </main>

  <footer class="footer">
    <p>美味厨房 &copy; 2026 &mdash; 发现美食，享受生活</p>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
